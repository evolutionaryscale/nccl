[project]
authors = [{name = "Steve Chan", email = ""}]
dependencies = []
name = "nccl-inspector-cu12"
requires-python = ">= 3.11"
version = "2.29.7"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
artifacts = ["*.so"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
build = "*"

[tool.pixi.dependencies]
make = "*"
compilers = "*"
cuda-libraries-dev = "=12.8"

[tool.pixi.tasks]
